[project]
# Vercel (and uv / pip) install the web app's dependencies from here. The app itself only needs pg8000;
# the scripts and tests use the Python standard library.
name = "shopassist-ai"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = ["pg8000==1.31.2"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# pyflakes (F) + pycodestyle errors (E); long generated SQL / prompt strings are allowed
select = ["E", "F"]
ignore = ["E501", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
